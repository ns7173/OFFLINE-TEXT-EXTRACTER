name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset 3 was not found.' }
          Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName 'bin')

      - name: Extract project ZIP
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'OfflineTextExtractor-Windows-Desktop-Source.zip' -DestinationPath 'source' -Force
          if (-not (Test-Path 'source/OfflineTextExtractor/gradlew.bat')) { throw 'Project ZIP is missing OfflineTextExtractor/gradlew.bat.' }

      - name: Build Windows installer EXE
        shell: pwsh
        run: .\source\OfflineTextExtractor\gradlew.bat --no-daemon -p .\source\OfflineTextExtractor :desktop:packageWindowsExe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTextExtractor-Windows-Installer
          path: source/OfflineTextExtractor/desktop/build/windows/*.exe
          if-no-files-found: error
          retention-days: 30
