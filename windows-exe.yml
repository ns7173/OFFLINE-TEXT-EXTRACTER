name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/windows-exe.yml'

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX Toolset for jpackage
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset 3 was not found after installation.' }
          Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName 'bin')

      - name: Build and package installer
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktop:packageWindowsExe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTextExtractor-Windows-Installer
          path: desktop/build/windows/*.exe
          if-no-files-found: error
          retention-days: 30
